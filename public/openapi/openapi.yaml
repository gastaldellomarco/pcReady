openapi: 3.0.3
info:
  title: PCReady API
  version: 1.0.0
  description: >
    REST API basata su Supabase PostgREST per ticket, inventario, clienti e referenti.
    Usa un JWT Supabase nel campo Authorize come Bearer token. Le policy RLS del database
    determinano le operazioni consentite per admin, tech e viewer.
servers:
  - url: https://{projectRef}.supabase.co/rest/v1
    description: Supabase REST API
    variables:
      projectRef:
        default: your-project
        description: Project ref Supabase, per esempio abcdefghijklmnop
  - url: /
    description: PCReady Server Functions
security:
  - bearerAuth: []
    supabaseAnonKey: []
tags:
  - name: Tickets
    description: Ticket di preparazione PC
  - name: Devices
    description: Inventario dispositivi
  - name: Clients
    description: Anagrafica clienti
  - name: Contacts
    description: Referenti associati ai clienti
  - name: Automations
    description: Flussi di automazione e log di esecuzione
  - name: OAuth
    description: Autorizzazione OAuth2 client esterni
  - name: Notifications
    description: Notifiche in-app per gli utenti
  - name: Checklist
    description: Template checklist preparazione PC
  - name: Versioning
    description: Storico versioni delle entità
  - name: Admin
    description: Gestione utenti e impostazioni applicazione
  - name: EmailTemplates
    description: Template email transazionali
paths:
  /tickets:
    get:
      tags: [Tickets]
      summary: Lista ticket
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
        - name: status
          in: query
          schema:
            type: string
            example: eq.pending
        - name: client_id
          in: query
          schema:
            type: string
            example: eq.00000000-0000-0000-0000-000000000000
      responses:
        "200":
          description: Elenco ticket
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      tags: [Tickets]
      summary: Crea ticket
      parameters:
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInsert"
      responses:
        "201":
          description: Ticket creato
    patch:
      tags: [Tickets]
      summary: Aggiorna ticket
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            example: eq.00000000-0000-0000-0000-000000000000
          description: Filtro PostgREST sull'id.
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Ticket aggiornato
    delete:
      tags: [Tickets]
      summary: Elimina ticket
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            example: eq.00000000-0000-0000-0000-000000000000
          description: Filtro PostgREST sull'id.
      responses:
        "204":
          description: Ticket eliminato
  /devices:
    get:
      tags: [Devices]
      summary: Lista dispositivi
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
        - name: status
          in: query
          schema:
            type: string
            example: eq.available
        - name: client_id
          in: query
          schema:
            type: string
            example: eq.00000000-0000-0000-0000-000000000000
      responses:
        "200":
          description: Elenco dispositivi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      tags: [Devices]
      summary: Crea dispositivo
      parameters:
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInsert"
      responses:
        "201":
          description: Dispositivo creato
    patch:
      tags: [Devices]
      summary: Aggiorna dispositivo
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            example: eq.00000000-0000-0000-0000-000000000000
          description: Filtro PostgREST sull'id.
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: Dispositivo aggiornato
  /clients:
    get:
      tags: [Clients]
      summary: Lista clienti
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
      responses:
        "200":
          description: Elenco clienti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      tags: [Clients]
      summary: Crea cliente
      parameters:
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInsert"
      responses:
        "201":
          description: Cliente creato
    patch:
      tags: [Clients]
      summary: Aggiorna cliente
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            example: eq.00000000-0000-0000-0000-000000000000
          description: Filtro PostgREST sull'id.
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Cliente aggiornato
  /client_contacts:
    get:
      tags: [Contacts]
      summary: Lista referenti
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
        - name: client_id
          in: query
          schema:
            type: string
            example: eq.00000000-0000-0000-0000-000000000000
      responses:
        "200":
          description: Elenco referenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientContact"
    post:
      tags: [Contacts]
      summary: Crea referente
      parameters:
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientContactInsert"
      responses:
        "201":
          description: Referente creato
  /notifications:
    get:
      tags: [Notifications]
      summary: Lista notifiche utente
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Elenco notifiche
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    patch:
      tags: [Notifications]
      summary: Aggiorna notifica
      parameters:
        - $ref: "#/components/parameters/idFilter"
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationUpdate"
      responses:
        "200":
          description: Notifica aggiornata
  /checklist_templates:
    get:
      tags: [Checklist]
      summary: Lista template checklist
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Elenco template checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistTemplate"
    post:
      tags: [Checklist]
      summary: Crea template checklist
      parameters:
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTemplateInsert"
      responses:
        "201":
          description: Template creato
    patch:
      tags: [Checklist]
      summary: Aggiorna template checklist
      parameters:
        - $ref: "#/components/parameters/idFilter"
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTemplateUpdate"
      responses:
        "200":
          description: Template aggiornato
    delete:
      tags: [Checklist]
      summary: Elimina template checklist
      parameters:
        - $ref: "#/components/parameters/idFilter"
      responses:
        "204":
          description: Template eliminato
  /entity_versions:
    get:
      tags: [Versioning]
      summary: Lista versioni entità
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/limit"
        - name: entity_type
          in: query
          schema:
            type: string
            example: eq.automation_flows
        - name: entity_id
          in: query
          schema:
            type: string
            example: eq.00000000-0000-0000-0000-000000000000
      responses:
        "200":
          description: Storico versioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityVersion"
  /app_settings:
    get:
      tags: [Admin]
      summary: Lista impostazioni applicazione
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
      responses:
        "200":
          description: Elenco impostazioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppSettings"
    patch:
      tags: [Admin]
      summary: Aggiorna impostazione applicazione
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            example: eq.branding
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Impostazione aggiornata
  /email_templates:
    get:
      tags: [EmailTemplates]
      summary: Lista template email
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Elenco template email
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplate"
    post:
      tags: [EmailTemplates]
      summary: Crea template email
      parameters:
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplateInsert"
      responses:
        "201":
          description: Template email creato
    patch:
      tags: [EmailTemplates]
      summary: Aggiorna template email
      parameters:
        - $ref: "#/components/parameters/idFilter"
        - $ref: "#/components/parameters/preferReturn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplateUpdate"
      responses:
        "200":
          description: Template email aggiornato
    delete:
      tags: [EmailTemplates]
      summary: Elimina template email
      parameters:
        - $ref: "#/components/parameters/idFilter"
      responses:
        "204":
          description: Template email eliminato
  /activity_log:
    get:
      tags: [Admin]
      summary: Lista audit log attività
      parameters:
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Elenco attività
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"
  /oauth/authorize:
    get:
      tags: [OAuth]
      summary: Avvia autorizzazione OAuth2
      security:
        - bearerAuth: []
      servers:
        - url: /
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: scope
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Pagina o payload di autorizzazione
  /oauth/consent:
    post:
      tags: [OAuth]
      summary: Conferma consenso OAuth2
      security:
        - bearerAuth: []
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string, format: uri }
                scope: { type: string }
                state: { type: string }
      responses:
        "302":
          description: Redirect con authorization code
  /oauth/token:
    post:
      tags: [OAuth]
      summary: Scambia authorization code per token
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, client_id, redirect_uri]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                code: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                redirect_uri: { type: string, format: uri }
      responses:
        "200":
          description: Token OAuth2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
  /api/automations/run:
    post:
      tags: [Automations]
      summary: Esegui un'automazione ora
      security:
        - bearerAuth: []
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunAutomationNowRequest"
      responses:
        "200":
          description: Log esecuzione creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunLog"
  /api/automations/run-logs:
    post:
      tags: [Automations]
      summary: Lista log esecuzione automazione
      security:
        - bearerAuth: []
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [automationId]
              properties:
                automationId: { type: string, format: uuid }
      responses:
        "200":
          description: Log esecuzione
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRunLog"
  /api/automations/run-stats:
    post:
      tags: [Automations]
      summary: KPI e statistiche run automazioni
      security:
        - bearerAuth: []
      servers:
        - url: /
      responses:
        "200":
          description: Statistiche run automazioni
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunStatsResponse"
  /api/admin/users/invite:
    post:
      tags: [Admin]
      summary: Invita utente amministrativo
      security:
        - bearerAuth: []
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInviteRequest"
      responses:
        "200":
          description: Utente invitato
  /api/admin/users/update:
    post:
      tags: [Admin]
      summary: Aggiorna utente amministrativo
      security:
        - bearerAuth: []
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequest"
      responses:
        "200":
          description: Utente aggiornato
  /api/admin/users/disable:
    post:
      tags: [Admin]
      summary: Abilita o disabilita utente amministrativo
      security:
        - bearerAuth: []
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserDisabledRequest"
      responses:
        "200":
          description: Stato utente aggiornato
  /api/admin/users/delete:
    post:
      tags: [Admin]
      summary: Elimina utente amministrativo
      security:
        - bearerAuth: []
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        "200":
          description: Utente eliminato
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    supabaseAnonKey:
      type: apiKey
      in: header
      name: apikey
  parameters:
    select:
      name: select
      in: query
      schema:
        type: string
        default: "*"
      description: Proiezione PostgREST, per esempio id,name,created_at.
    order:
      name: order
      in: query
      schema:
        type: string
        example: created_at.desc
      description: Ordinamento PostgREST.
    limit:
      name: limit
      in: query
      schema:
        type: integer
        example: 20
      description: Numero massimo di record PostgREST.
    idFilter:
      name: id
      in: query
      required: true
      schema:
        type: string
        example: eq.00000000-0000-0000-0000-000000000000
      description: Filtro PostgREST sull'id.
    preferReturn:
      name: Prefer
      in: header
      schema:
        type: string
        default: return=representation
  schemas:
    Client:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        company_name: { type: string, nullable: true }
        vat_number: { type: string, nullable: true }
        fiscal_code: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClientInsert:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Azienda Alpha }
        company_name: { type: string, example: Azienda Alpha }
        vat_number: { type: string, nullable: true }
        fiscal_code: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    ClientUpdate:
      allOf:
        - $ref: "#/components/schemas/ClientInsert"
    ClientContact:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        job_title: { type: string, nullable: true }
        department: { type: string, nullable: true }
        is_primary: { type: boolean }
        notes: { type: string, nullable: true }
    ClientContactInsert:
      type: object
      required: [client_id, first_name]
      properties:
        client_id: { type: string, format: uuid }
        full_name: { type: string, example: Mario Rossi }
        first_name: { type: string, example: Mario }
        last_name: { type: string, example: Rossi }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        job_title: { type: string, nullable: true }
        department: { type: string, nullable: true }
        is_primary: { type: boolean, default: false }
        notes: { type: string, nullable: true }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        serial: { type: string, nullable: true }
        model: { type: string }
        os: { type: string, nullable: true }
        assigned_to: { type: string, nullable: true }
        status:
          type: string
          enum: [available, assigned, maintenance, retired]
        notes: { type: string, nullable: true }
    DeviceInsert:
      type: object
      required: [client_id, model]
      properties:
        client_id: { type: string, format: uuid }
        model: { type: string, example: Dell Latitude 5540 }
        serial: { type: string, nullable: true }
        os: { type: string, nullable: true }
        assigned_to: { type: string, nullable: true }
        status:
          type: string
          enum: [available, assigned, maintenance, retired]
          default: available
        notes: { type: string, nullable: true }
    DeviceUpdate:
      allOf:
        - $ref: "#/components/schemas/DeviceInsert"
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_code: { type: string }
        client: { type: string }
        client_id: { type: string, format: uuid, nullable: true }
        device_id: { type: string, format: uuid, nullable: true }
        requester: { type: string }
        requester_contact_id: { type: string, format: uuid, nullable: true }
        model: { type: string, nullable: true, deprecated: true }
        serial: { type: string, nullable: true, deprecated: true }
        priority:
          type: string
          enum: [high, med, low]
        status:
          type: string
          enum: [pending, in-progress, testing, ready]
    TicketInsert:
      type: object
      required: [client, requester]
      properties:
        ticket_code: { type: string, example: PC-0001 }
        client: { type: string }
        client_id: { type: string, format: uuid, nullable: true }
        device_id: { type: string, format: uuid, nullable: true }
        requester: { type: string }
        requester_contact_id: { type: string, format: uuid, nullable: true }
        model: { type: string, nullable: true, deprecated: true }
        serial: { type: string, nullable: true, deprecated: true }
        priority:
          type: string
          enum: [high, med, low]
          default: med
        status:
          type: string
          enum: [pending, in-progress, testing, ready]
          default: pending
    TicketUpdate:
      allOf:
        - $ref: "#/components/schemas/TicketInsert"
    JsonObject:
      type: object
      additionalProperties: true
    AutomationFlow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        active: { type: boolean }
        version: { type: integer }
        flow_definition:
          $ref: "#/components/schemas/JsonObject"
        trigger_definition:
          allOf:
            - $ref: "#/components/schemas/JsonObject"
          nullable: true
        actions_definition:
          type: array
          items:
            $ref: "#/components/schemas/JsonObject"
          nullable: true
        summary: { type: string, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AutomationRunLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        automation_id: { type: string, format: uuid }
        triggered_at: { type: string, format: date-time }
        triggered_by: { type: string, format: uuid, nullable: true }
        status:
          type: string
