name: Lighthouse

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      LHCI_URL: ${{ vars.LHCI_URL || 'https://pcready.mavcoo.it/' }}
      # Choose budget phase: phase1, phase2, phase3. Can be set as repo var LHCI_BUDGET_STAGE
      BUDGET_STAGE: ${{ vars.LHCI_BUDGET_STAGE || 'phase1' }}
    steps:
      - uses: actions/checkout@v5

      - name: Post-deploy healthcheck
        run: |
          set -euo pipefail

          echo "Running post-deploy healthcheck for ${LHCI_URL}"
          chmod +x ./scripts/ci/healthcheck.sh
          # Arguments: <url> <attempts> <wait_seconds> <warmup>
          ./scripts/ci/healthcheck.sh "${LHCI_URL}" 5 15 true

      - name: Lighthouse CI healthcheck
        run: npx @lhci/cli healthcheck --fatal

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ env.LHCI_URL }}
          # select budget file per stage
          budgetPath: ./lighthouse-budget-${{ env.BUDGET_STAGE }}.json
          uploadArtifacts: true
          temporaryPublicStorage: true
