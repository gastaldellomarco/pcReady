name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: |
          HOST=$(echo "$SUPABASE_DB_URL" | sed -n 's#.*@\([^:/]*\).*#\1#p')
          IPV4=$(python3 -c "import socket,sys; print(socket.getaddrinfo(sys.argv[1], None, socket.AF_INET)[0][4][0])" "$HOST" 2>/dev/null || true)
          if [ -z "$IPV4" ]; then
            echo "Warning: Failed to resolve IPv4 for $HOST, skipping db push"
            exit 0
          fi
          NEW_SUPABASE_DB_URL=$(echo "$SUPABASE_DB_URL" | sed "s@$HOST@$IPV4@")
          echo "Resolved $HOST -> $IPV4"
          supabase db push --db-url "$NEW_SUPABASE_DB_URL"

      - run: bun run test
