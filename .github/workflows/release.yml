name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo di bump semver"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Bump version & create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          NEW_VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          VERSION=${NEW_VERSION#v}
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Nuova versione: ${TAG}"

      - name: Update changelog
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          bash scripts/update-changelog.sh "${{ steps.bump.outputs.version }}" "${{ steps.bump.outputs.tag }}"

      - name: Validate changelog links
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          grep -q "^\[Unreleased\]: https://github.com/gastaldellomarco/pcReady/compare/${{ steps.bump.outputs.tag }}...HEAD$" CHANGELOG.md
          grep -q "^\[${{ steps.bump.outputs.version }}\]: https://github.com/gastaldellomarco/pcReady/compare/" CHANGELOG.md

      - name: Commit version bump
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"

      - name: Create tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git tag ${{ steps.bump.outputs.tag }}

      - name: Push commit + tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git push origin main
          git push origin ${{ steps.bump.outputs.tag }}

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && steps.bump.outputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#v}"
          node --input-type=module - "$VERSION" <<'JS' > /tmp/changelog.md
          import fs from "node:fs";

          const [version] = process.argv.slice(2);
          const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
          const start = lines.findIndex((line) => line.startsWith(`## [${version}] - `));
          const end =
            start === -1
              ? -1
              : lines.findIndex((line, index) => index > start && line.startsWith("## ["));
          const body =
            start === -1
              ? "Release automatica."
              : lines.slice(start + 1, end === -1 ? undefined : end).join("\n").trim();
          process.stdout.write(body || "Release automatica.");
          JS
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && steps.bump.outputs.tag || github.ref_name }}
          name: "PCReady ${{ github.event_name == 'workflow_dispatch' && steps.bump.outputs.tag || github.ref_name }}"
          body_path: /tmp/changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
